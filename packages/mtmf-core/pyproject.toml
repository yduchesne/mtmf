[project]
name = "mtmf-core"
version = "0.1.0"
description = "MTMF framework core: domain model, application layer, and authorization."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtmf_core"]

[tool.hatch.build.targets.wheel.force-include]
"src/mtmf_core/persistence/postgres/migrations" = "mtmf_core/persistence/postgres/migrations"
"src/mtmf_core/persistence/postgres/sql" = "mtmf_core/persistence/postgres/sql"
