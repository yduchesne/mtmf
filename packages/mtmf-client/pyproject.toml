[project]
name = "mtmf-client"
version = "0.1.0"
description = "MTMF consumer-facing client implementing the mtmf-api contract."
requires-python = ">=3.14"
dependencies = ["mtmf-api==0.1.0"]

[tool.uv.sources]
mtmf-api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtmf_client"]