# Private MTMF permission-engine crate.
#
# Private deterministic Rust permission-policy kernel for MTMF: the pure,
# I/O-free decision engine behind the internal RustPermissionEvaluator
# seam. This is package metadata, not a PR history log.
#
# Invariants for the Rust kernel:
# - pure, deterministic, side-effect-free computation only;
# - no I/O, no database, no network, no async runtime, no background
#   threads;
# - Python (the Authorizer) owns policy applicability and authorization
#   context; Rust receives only detached primitive policy input;
# - no live MTMF Python domain objects cross the FFI boundary.
[package]
name = "mtmf-permission-engine"
version = "0.1.0"
description = "Private deterministic Rust permission-policy kernel for MTMF."
license = "AGPL-3.0"
edition = "2024"
rust-version = "1.98"

[lib]
name = "mtmf_permission_engine"
crate-type = ["cdylib"]

[dependencies]
# PyO3 0.29.x is the stable binding generation used by the maturin build.
# It supports the Python 3.14 baseline required by the workspace.
pyo3 = "0.29.2"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
