# Private MTMF permission-engine crate (PR 8A foundation + PR 8B
# model/matcher + PR 8C evaluator + PR 8D integration).
#
# PR 8A delivered the crate foundation and a deterministic smoke/capability
# surface. PR 8B adds the detached native policy model (model.rs), the SYSTEM
# Action/Permission URN parsers (urn.rs), and the single-Permission matcher
# with match specificity (matcher.rs). PR 8C adds the complete policy-decision
# algorithm (evaluator.rs): maximum specificity selection, lower-specificity
# elimination, equal-specificity DENY precedence, and default DENY. PR 8D
# integrates the kernel behind the internal evaluator seam and makes it the
# active/default Authorizer policy engine; the Python evaluator
# (`mtmf_core.authorization.permission_evaluator`) remains the semantic
# reference, and systematic generated differential tests prove equivalence.
#
# Invariants for the Rust series:
# - pure, deterministic, side-effect-free computation only;
# - no I/O, no database, no network, no async runtime, no background
#   threads;
# - Python (the Authorizer) owns policy applicability and authorization
#   context; Rust receives only detached primitive policy input;
# - no live MTMF Python domain objects cross the FFI boundary.
[package]
name = "mtmf-permission-engine"
version = "0.1.0"
description = "Private, deterministic MTMF permission-policy kernel (PR 8A foundation; PR 8B model and matcher; PR 8C evaluator; PR 8D integration)."
license = "AGPL-3.0"
edition = "2024"
rust-version = "1.98"

[lib]
name = "mtmf_permission_engine"
crate-type = ["cdylib"]

[dependencies]
# PyO3 0.29.x is the stable binding generation used by the maturin build.
# It supports the Python 3.14 baseline required by the workspace.
pyo3 = "0.29.2"