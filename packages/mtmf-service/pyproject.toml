[project]
name = "mtmf-service"
version = "0.1.0"
description = "MTMF optional HTTP deployment adapting mtmf-api and mtmf-core."
requires-python = ">=3.14"
dependencies = [
    "mtmf-api==0.1.0",
    "mtmf-core==0.1.0",
]

[tool.uv.sources]
mtmf-api = { workspace = true }
mtmf-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtmf_service"]