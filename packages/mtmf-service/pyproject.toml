[project]
name = "mtmf-service"
version = "0.1.0"
description = "MTMF optional HTTP deployment adapting mtmf-api and mtmf-core."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "mtmf-api==0.1.0",
    "mtmf-core==0.1.0",
    "opentelemetry-api>=1.37,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.37,<2",
    "opentelemetry-sdk>=1.37,<2",
    "pyjwt[crypto]>=2.13,<3",
    "uvicorn>=0.30",
]

[tool.uv.sources]
mtmf-api = { workspace = true }
mtmf-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtmf_service"]
