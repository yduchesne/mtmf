[project]
name = "mtmf-control-plane"
version = "0.1.0a1"
description = "MTMF isolated PR 24P operator and pre-Tenant control plane."
requires-python = ">=3.14"
dependencies = [
    "mtmf-core==0.1.0a1",
    "mtmf-service==0.1.0a1",
    "psycopg[binary]>=3.3.6",
]

[tool.uv.sources]
mtmf-core = { workspace = true }
mtmf-service = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtmf_control_plane"]
