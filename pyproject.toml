[project]
name = "mtmf-workspace"
version = "0.1.0"
description = "Multi-Tenant Management Framework (MTMF) Python workspace"
requires-python = ">=3.14"
dependencies = [
    "mtmf-api==0.1.0",
    "mtmf-core==0.1.0",
    "mtmf-client==0.1.0",
    "mtmf-service==0.1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
mtmf-api = { workspace = true }
mtmf-core = { workspace = true }
mtmf-client = { workspace = true }
mtmf-service = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/mtmf-api",
    "packages/mtmf-core",
    "packages/mtmf-client",
    "packages/mtmf-service",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "hypothesis>=6.115.4",
    "maturin>=1.15,<1.16",
    "msgspec>=0.22.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.9",
    "semgrep>=1.178.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
# The Python quality gate measures the workspace; authoritative docs and
# plan drafting files are out of scope for formatting/linting.
extend-exclude = ["docs", ".plans"]
src = [
    "packages/mtmf-api/src",
    "packages/mtmf-core/src",
    "packages/mtmf-client/src",
    "packages/mtmf-service/src",
    "tests",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "RUF", # Ruff-specific
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = [
    "--cov=mtmf_core",
    "--cov=mtmf_api",
    "--cov=mtmf_client",
    "--cov=mtmf_service",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
