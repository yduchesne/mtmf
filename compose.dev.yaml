# MTMF-owned local development override (PR 17 / PR 17-C).
#
# DEVELOPMENT ONLY. Never used for production. Always invoke with the
# explicit MTMF project name:
#
#   python scripts/mtmf-dev-stack.py up
#
# Portable orchestration: `podman-compose 1.0.6` does not honor
# `depends_on: condition: service_completed_successfully`, so the explicit
# `scripts/mtmf-dev-stack.py` launcher waits for PostgreSQL/Keycloak health,
# probes the canonical issuer from the host and the container network, runs
# the privileged one-shot initializer, and only then starts the unprivileged
# service and waits for readiness. The `depends_on` below is startup ordering
# only and is not a correctness guarantee on this tooling.
#
# Canonical issuer (PR 17-C)
# --------------------------
# The single canonical development authority is
# `https://keycloak.mtmf.test:28443/realms/mtmf-pr14-dev`. It is the identical
# string in discovery `issuer`, token `iss`, `MTMF_AUTH_ISSUER` and
# `MTMF_AUTH_JWKS_URI`. Keycloak keeps its internal HTTPS listener on 8443; a
# tiny, non-privileged, MTMF-owned TCP forwarder (`forwarder`) listens on the
# canonical port 28443 inside the isolated network and forwards bytes without
# terminating TLS. Containers resolve `keycloak.mtmf.test` through the MTMF
# network alias; the Windows browser and WSL host resolve it to loopback and
# reach the loopback-published Keycloak port. TLS, hostname/SAN and issuer
# validation remain intact end to end; there is no second issuer and no host
# networking.
#
# Resource ownership: every resource belongs to the explicit `mtmf`
# project. MTMF tooling never discovers, mutates, or prunes resources owned
# by ATI, Digr, Darkula, Hammeridian, or any other application.
#
# Host ports: MTMF owns local host-port prefix `2`. PostgreSQL remains
# 25432 (from compose.yaml). Keycloak publishes loopback 28443/28080 and
# the HTTP service publishes loopback 28001. Every publication binds
# loopback only.
#
# Secrets: supplied at runtime via `.env`/Podman secrets. No secret,
# bootstrap admin credential, migrator credential or client secret is
# committed here. The HTTP service environment intentionally excludes
# migrator/owner/bootstrap credentials; only the restricted runtime and
# the read-only attestation reader are present.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0-1
    command:
      - start-dev
      - --http-port=8080
      - --https-port=8443
      - --hostname=https://keycloak.mtmf.test:28443
      - --hostname-strict=true
      - --hostname-backchannel-dynamic=false
      - --health-enabled=true
      - --https-certificate-file=/opt/keycloak/conf/tls/server.crt
      - --https-certificate-key-file=/opt/keycloak/conf/tls/server.key
    environment:
      # Canonical development-only master-realm administrator (PR 17-C Fixup 2).
      # On a fresh volume Keycloak creates `mtmf-admin`; on an existing volume the
      # bootstrap variables do not rename/reset users and an explicit Admin REST
      # migration is required (see docs/DEVELOPMENT_SETUP.md).
      KC_BOOTSTRAP_ADMIN_USERNAME: ${MTMF_DEV_KC_ADMIN_USERNAME:-mtmf-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${MTMF_DEV_KC_ADMIN_PASSWORD:?set MTMF_DEV_KC_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTPS_ENABLED: "true"
      KC_HOSTNAME_STRICT: "true"
    ports:
      - "127.0.0.1:${MTMF_PR14_KC_HTTP_PORT:-28080}:8080"
      - "127.0.0.1:${MTMF_PR14_KC_HTTPS_PORT:-28443}:8443"
    volumes:
      - mtmf-dev-keycloak-data:/opt/keycloak/data
      # Individual public/leaf files only: the CA private key is never mounted
      # into any container. The leaf key is owner-mapped to the Keycloak
      # container UID by `scripts/mtmf-dev-certs.py harden`.
      - ${MTMF_DEV_CA_DIR:-/tmp/mtmf-dev-ca}/server.crt:/opt/keycloak/conf/tls/server.crt:ro
      - ${MTMF_DEV_CA_DIR:-/tmp/mtmf-dev-ca}/server.key:/opt/keycloak/conf/tls/server.key:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # MTMF-owned internal TLS TCP forwarder. Listens on the canonical port
  # 28443 inside the isolated `mtmf` network and forwards to Keycloak's
  # internal 8443 without terminating TLS or exposing a second issuer. It is
  # non-privileged, never host-published, and serves the `keycloak.mtmf.test`
  # network alias for the initializer and service containers.
  forwarder:
    image: docker.io/library/python:3.14-slim
    command: ["python", "/app/mtmf-dev-forwarder.py"]
    environment:
      MTMF_DEV_FORWARDER_LISTEN_HOST: 0.0.0.0
      MTMF_DEV_FORWARDER_PORT: "28443"
      MTMF_DEV_FORWARDER_TARGET_HOST: keycloak
      MTMF_DEV_FORWARDER_TARGET_PORT: "8443"
      PYTHONDONTWRITEBYTECODE: "1"
    networks:
      default:
        aliases:
          - keycloak.mtmf.test
    volumes:
      - ./scripts/mtmf-dev-forwarder.py:/app/mtmf-dev-forwarder.py:ro
      - ./scripts/mtmf-dev-probe.py:/app/mtmf-dev-probe.py:ro
      - ${MTMF_DEV_CA_DIR:-/tmp/mtmf-dev-ca}/dev-ca.crt:/certs/mtmf-ca.crt:ro
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 28443), 2).close()\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  initializer:
    build:
      context: .
      dockerfile: Dockerfile.service
    command: ["python", "scripts/mtmf-dev-initialize.py"]
    environment:
      MTMF_SERVICE_DEPLOYMENT_MODE: development
      MTMF_SERVICE_ALLOW_CONTAINER_BIND: "1"
      MTMF_MIGRATOR_DATABASE_URL: ${MTMF_MIGRATOR_DATABASE_URL:?set MTMF_MIGRATOR_DATABASE_URL}
      MTMF_POSTGRES_DB: ${MTMF_POSTGRES_DB:-mtmf}
      MTMF_AUTH_ISSUER: ${MTMF_AUTH_ISSUER:?set MTMF_AUTH_ISSUER}
      MTMF_AUTH_SERVICE_AUDIENCE: ${MTMF_AUTH_SERVICE_AUDIENCE:?set service audience}
      MTMF_AUTH_USER_AUDIENCE: ${MTMF_AUTH_USER_AUDIENCE:?set user audience}
      MTMF_AUTH_ADMIN_REALM: ${MTMF_AUTH_ADMIN_REALM:-mtmf-pr14-dev}
      MTMF_AUTH_ADMIN_BASE: ${MTMF_AUTH_ADMIN_BASE:-https://keycloak.mtmf.test:28443}
      # The initializer's Admin REST client uses the SAME canonical development
      # administrator identity/credential as the Keycloak bootstrap above; it is
      # never a separate master-admin login. The launcher enforces this.
      MTMF_AUTH_ADMIN_USERNAME: ${MTMF_AUTH_ADMIN_USERNAME:-mtmf-admin}
      MTMF_AUTH_ADMIN_PASSWORD: ${MTMF_AUTH_ADMIN_PASSWORD:?set MTMF_AUTH_ADMIN_PASSWORD}
      MTMF_DEV_APPLICATION_KEYS: ${MTMF_DEV_APPLICATION_KEYS:-sample-app}
      MTMF_DEV_TENANT_KEY: ${MTMF_DEV_TENANT_KEY:-dev}
      MTMF_DEV_TENANT_NAME: ${MTMF_DEV_TENANT_NAME:-Development Tenant}
      # Trust the MTMF development CA only (public certificate, read-only).
      SSL_CERT_FILE: /certs/mtmf-ca.crt
      # PR 17-B development user create-or-verify. The username is required
      # and creation is opt-in (default false). The password file is a
      # read-only container path backed by the restricted host secret mount
      # below; no plaintext password is ever placed in this file or `.env`.
      MTMF_DEV_USER_USERNAME: ${MTMF_DEV_USER_USERNAME:?set development username}
      MTMF_DEV_USER_EMAIL: ${MTMF_DEV_USER_EMAIL:-}
      MTMF_DEV_USER_CREATE: ${MTMF_DEV_USER_CREATE:-false}
      MTMF_DEV_USER_PASSWORD_FILE: ${MTMF_DEV_USER_PASSWORD_FILE:-/run/mtmf-secrets/dev-user-password}
      # Optional assertion only: when set it must equal the actual Keycloak
      # user ID. It is never a fabricated identity source.
      MTMF_DEV_USER_SUBJECT: ${MTMF_DEV_USER_SUBJECT:-}
    volumes:
      # Read-only restricted mount of the MTMF-owned secret directory (0700
      # host directory, 0600 secret files). This never exposes another
      # application's resources; the initializer validates the password
      # file's type, ownership and mode before reading it.
      - ${MTMF_DEV_SECRET_DIR:-/tmp/mtmf-dev-secrets}:/run/mtmf-secrets:ro
      # Public development CA certificate only; the private keys stay on the
      # host and are never mounted.
      - ${MTMF_DEV_CA_DIR:-/tmp/mtmf-dev-ca}/dev-ca.crt:/certs/mtmf-ca.crt:ro
      # Resolver override: DNS (the MTMF network alias) is authoritative over
      # the host `/etc/hosts` entry Podman copies into the container, so
      # `keycloak.mtmf.test` resolves to the current forwarder without baking a
      # dynamic IP into the Compose model (PR 17-C Amendment 2).
      - ./dev/nsswitch.conf:/etc/nsswitch.conf:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      forwarder:
        condition: service_healthy
    restart: "no"

  service:
    build:
      context: .
      dockerfile: Dockerfile.service
    command: ["python", "-m", "mtmf_service"]
    environment:
      MTMF_SERVICE_DEPLOYMENT_MODE: development
      MTMF_SERVICE_HOST: 0.0.0.0
      MTMF_SERVICE_PORT: "28001"
      MTMF_SERVICE_ALLOW_CONTAINER_BIND: "1"
      MTMF_SERVICE_INITIALIZED: "1"
      MTMF_SERVICE_MAX_IN_FLIGHT_EVALUATIONS: ${MTMF_SERVICE_MAX_IN_FLIGHT_EVALUATIONS:-40}
      MTMF_RUNTIME_DATABASE_URL: ${MTMF_RUNTIME_DATABASE_URL:?set MTMF_RUNTIME_DATABASE_URL}
      MTMF_RUNTIME_STATEMENT_TIMEOUT_MS: ${MTMF_RUNTIME_STATEMENT_TIMEOUT_MS:-10000}
      MTMF_RUNTIME_LOCK_TIMEOUT_MS: ${MTMF_RUNTIME_LOCK_TIMEOUT_MS:-3000}
      # Read-only attestation reader; never the bootstrap admin.
      MTMF_AUTH_ISSUER: ${MTMF_AUTH_ISSUER:?set MTMF_AUTH_ISSUER}
      MTMF_AUTH_SERVICE_AUDIENCE: ${MTMF_AUTH_SERVICE_AUDIENCE:?set service audience}
      MTMF_AUTH_USER_AUDIENCE: ${MTMF_AUTH_USER_AUDIENCE:?set user audience}
      MTMF_AUTH_JWKS_URI: ${MTMF_AUTH_JWKS_URI:?set JWKS URI}
      MTMF_AUTH_EXPECTED_MANIFEST: ${MTMF_AUTH_EXPECTED_MANIFEST:-dev/keycloak/expected-realm-security.json}
      MTMF_AUTH_EXPECTED_CLIENT_POLICY: ${MTMF_AUTH_EXPECTED_CLIENT_POLICY:-dev/keycloak/expected-client-policy.json}
      MTMF_AUTH_ADMIN_REALM: ${MTMF_AUTH_ADMIN_REALM:-mtmf-pr14-dev}
      MTMF_AUTH_ADMIN_BASE: ${MTMF_AUTH_ADMIN_BASE:-https://keycloak.mtmf.test:28443}
      # Trust the MTMF development CA only (public certificate, read-only).
      SSL_CERT_FILE: /certs/mtmf-ca.crt
      # Dedicated least-privilege client-credentials reader; no admin password.
      # Prefer MTMF_AUTH_ATTESTATION_CLIENT_SECRET_FILE with a mounted secret;
      # the plain variable is the documented development placeholder.
      MTMF_AUTH_ATTESTATION_CLIENT_ID: ${MTMF_AUTH_ATTESTATION_CLIENT_ID:?set attestation reader client id}
      MTMF_AUTH_ATTESTATION_CLIENT_SECRET: ${MTMF_AUTH_ATTESTATION_CLIENT_SECRET:?set attestation reader client secret}
    volumes:
      # Public development CA certificate only.
      - ${MTMF_DEV_CA_DIR:-/tmp/mtmf-dev-ca}/dev-ca.crt:/certs/mtmf-ca.crt:ro
      # Resolver override mirroring the initializer: DNS wins, so the canonical
      # name resolves to the current forwarder without a dynamic Compose input.
      - ./dev/nsswitch.conf:/etc/nsswitch.conf:ro
    ports:
      - "127.0.0.1:28001:28001"
    depends_on:
      postgres:
        condition: service_healthy
      initializer:
        condition: service_started
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:28001/health/ready',timeout=2).status==200 else 1)\""
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mtmf-dev-keycloak-data:
    name: mtmf-dev-keycloak-data
