# MTMF development container resolver override (PR 17-C Amendment 2).
#
# Rootless Podman copies the host `/etc/hosts` into every container. The
# operator-managed `127.0.0.1 keycloak.mtmf.test` entry therefore appears in
# containers and would otherwise shadow the MTMF network alias. Putting DNS
# before `files` makes the isolated MTMF DNS (aardvark) authoritative, so
# `keycloak.mtmf.test` resolves to the current forwarder address without any
# per-container IP baked into the Compose model. This keeps the Compose
# configuration hash stable across repeated `up` operations while preserving
# strict TLS/issuer verification.
#
# This file is mounted read-only at `/etc/nsswitch.conf` in the initializer and
# service containers. It is not used by the host, Keycloak, PostgreSQL, or the
# forwarder.
passwd:         files
group:          files
shadow:         files
hosts:          dns files
networks:       files
protocols:      files
services:       files
ethers:         files
rpc:            files
