# MTMF Grafana datasource provisioning (PR 19).
#
# Fixed datasource UIDs keep dashboards-as-code stable. Loki to Jaeger
# derived-field correlation is configured so a log line with a valid OTel
# trace id links to the corresponding trace.
apiVersion: 1

datasources:
  - name: MTMF Prometheus
    uid: mtmf-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: MTMF Jaeger
    uid: mtmf-jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686

  - name: MTMF Loki
    uid: mtmf-loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - datasourceUid: mtmf-jaeger
          matcherRegex: '"trace_id":"([0-9a-f]{32})"'
          name: TraceID
          url: "$${__value.raw}"
