# Root Cargo workspace for MTMF's private Rust components.
#
# The workspace holds the private deterministic `mtmf-permission-engine`
# PyO3 native crate (the pure permission-policy kernel behind the internal
# RustPermissionEvaluator seam). The virtual workspace pins all transitive
# crate versions in the committed `Cargo.lock` (resolver 2) so `cargo fmt`,
# `cargo clippy`, `cargo test`, and maturin builds are deterministic.
#
# This workspace intentionally owns no persistence, network, or
# runtime-framework dependencies and performs no I/O.
[workspace]
resolver = "2"
members = ["packages/mtmf-permission-engine"]