name: CI
on: pull_request
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          # `./build.sh --rust` runs `cargo clippy` and `cargo fmt --check`.
          components: clippy,rustfmt

      - name: Synchronize locked dependencies
        run: uv sync --locked

      - name: Run canonical Rust/native gate
        run: ./build.sh --rust

      - name: Run canonical quality gate
        run: ./build.sh --qa

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: mtmf
          POSTGRES_USER: mtmf
          POSTGRES_PASSWORD: mtmf-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mtmf -d mtmf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MTMF_POSTGRES_HOST: 127.0.0.1
      MTMF_POSTGRES_PORT: "5432"
      MTMF_POSTGRES_DB: mtmf
      MTMF_POSTGRES_USER: mtmf
      MTMF_POSTGRES_PASSWORD: mtmf-ci-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Synchronize locked dependencies
        run: uv sync --locked

      - name: Run PostgreSQL integration gate
        run: ./build.sh --integration
