name: CI
on: pull_request
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1

      - name: Synchronize locked dependencies
        run: uv sync --locked

      - name: Run canonical Rust/native gate
        run: ./build.sh --rust

      - name: Run canonical quality gate
        run: ./build.sh --qa
